<!DOCTYPE html>
<html>
<head>
    <title>Task Manager App</title>
</head>
<body>

    <h1>Task Manager App</h1>

    <form action="/add" method="POST">
        <input type="text" name="title" placeholder="Enter task" required>
        <button type="submit">Add Task</button>
    </form>

    <hr>

    <h2>Task List</h2>

    <ul>
        {% for task in tasks %}
            <li>
                {{ task.title }}
                <a href="/delete/{{ task.id }}">Delete</a>
            </li>
        {% endfor %}
    </ul>

</body>
</html>
